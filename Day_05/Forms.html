<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms</title>
</head>

<body>
    <h1>Forms</h1>
    <form action="/register" method="post">
        <label for="name">Enter your name:</label>
        <input type="text" placeholder="Enter your name" id="name" name="name" required minlength="2" maxlength="20">
        <br>
        <br>
        <label for="age">Enter your age:</label>
        <input type="number" placeholder="Enter your age" id="age" name="age" required min="0" max="100">
        <br>
        <br>
        <label for="date">Enter your DOB:</label>
        <input type="date" placeholder="Enter your DOB" id="date" name="date" required>
        <br>
        <br>
        <label for="email">Enter your email:</label>
        <input type="email" placeholder="Enter your email" name="email" id="email" required value="zenithschool.ai"
            maxlength="100">
        <br>
        <br>
        <label for="password">Enter your password:</label>
        <input type="password" name="password" placeholder="Enter password" id="password" required minlength="8"
            maxlength="30">
        <br>
        <br>
        <label for="radio">Sex:</label>
        <br>
        <label for="radio">Male</label>
        <input type="radio" name="radio" id="radio" required name="gender">
        <label for="female">Female</label>
        <input type="radio" name="radio" id="female" required name="gender">
        <label for="other">Other</label>
        <input type="radio" name="radio" id="other" required name="gender">
        <br>
        <br>
        <label>How did you heard about us?</label>
        <div>
            <label for="ig">Social media</label>
            <input type="checkbox" name="checkbox" id="ig">
            <br>
            <label for="what">Whatsapp</label>
            <input type="checkbox" name="checkbox" id="what">
            <br>
            <label for="news">Newspaper</label>
            <input type="checkbox" name="checkbox" id="news">
        </div>
        <br>
        <button type="submit">Sumbit</button><button type="reset">Reset</button>
    </form>
</body>

</html>
