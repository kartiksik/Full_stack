<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lists</title>
</head>

<body>
    <h1>Lists in html</h1>
    <!-- ordered list -->
    <ol type="i">
        <li>item 1</li>
        <li>item 2</li>
    </ol>
    <!-- unordered list -->
    <ul type="square">
        <li>item 1</li>
        <li>item 2</li>
    </ul>
    <!-- Discription list -->
    <dl>
        <dt>Concept 1</dt>
        <dd>Lorem ipsum dolor sit amet consectetur adipisicing.</dd>
    </dl>

    <ul type="square">
        <li>
        <h2>frotend</h2>
        <ol>
            <li>html</li>
            <li>css</li>
            <li>js</li>
        </ol>
        </li>
    </ul>
</body>

</html>
